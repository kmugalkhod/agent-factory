# Runs the repo's own test and lint commands (tools/dev.py) on native Windows, the platform the
# factory targets first. A pull request merges only when this is green on its head commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Set up
        run: uv run tools/dev.py setup

      - name: Test
        run: uv run tools/dev.py test

      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run tools/dev.py lint
